<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component | KINEX.js</title>
<link rel="shortcut icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Neverquit;src:url(fonts/Neverquit.ttf);font-display:swap}
:root{--bg:#050506;--ac:#30D158;--sf:#151519;--tx:#F5F5F7;--bd:#26262C;--main:Neverquit,'Arial Black',sans-serif;--sec:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;scrollbar-width:thin;scrollbar-color:#333 transparent}
body{height:100vh;display:grid;grid-template-rows:60px 1fr;background:var(--bg);color:var(--tx);font:400 1rem/1.5 var(--sec);overflow:hidden}
a,button{color:inherit;font:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}

/* navbar */
header{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;border-bottom:1px solid var(--bd)}
.crumb{display:flex;align-items:center;gap:.8rem}
.crumb>span{font-size:1.4rem;color:#444}
.crumb b{font:700 1.05rem var(--sec)}
.brand{display:flex;align-items:center;gap:.7rem;font:400 1.5rem/1 var(--main)}
.brand img{height:2rem;filter:brightness(0) invert(1);transition:transform .7s cubic-bezier(.2,1.4,.3,1)}
.brand:hover img{transform:rotate(180deg) scale(1.15)}
.brand i{font-style:normal;color:var(--ac)}
header nav{display:flex;gap:.6rem}
.btn{cursor:pointer;background:linear-gradient(var(--ac),var(--ac)) no-repeat 0 0/0 100%;border:1px solid var(--bd);border-radius:8px;padding:.35rem .9rem;font-size:.88rem;transition:background-size .4s cubic-bezier(.7,0,.2,1),color .4s,border-color .4s}
.btn:hover,.btn:focus-visible{background-size:100% 100%;color:var(--bg);border-color:var(--ac)}

/* layout */
main{display:grid;grid-template-columns:1.1fr 1fr;min-height:0}
.pre{padding:.9rem;min-height:0}
.stage{position:relative;height:100%;display:grid;place-items:center;overflow:hidden;border:1px solid var(--bd);border-radius:20px;background:radial-gradient(rgba(128,128,128,.22) 1px,transparent 1px) 0 0/24px 24px,var(--pbg,#0b0b0e)}
.pill{position:absolute;bottom:.8rem;display:flex;align-items:center;gap:.5rem;padding:.3rem .75rem;border-radius:99px;background:#000b;color:#cfcfd4;font-size:.78rem}
.pill.l{left:.8rem}.pill.r{right:.8rem}
input[type=color]{width:1.7rem;height:1.4rem;padding:0;border:0;border-radius:5px;background:none;cursor:pointer}

/* embossed panels, engraved sections */
.side{display:grid;grid-template-rows:auto 1fr;gap:.9rem;padding:.9rem;min-height:0}
.panel{display:flex;flex-direction:column;gap:.6rem;min-height:0;padding:.8rem;border-radius:20px;background:linear-gradient(145deg,#1c1c22,#111115);box-shadow:7px 7px 16px #000c,-3px -3px 10px #ffffff0a,inset 1px 1px 0 #ffffff16}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font:700 .95rem var(--sec)}
.ph .btn{padding:.2rem .7rem;font-size:.8rem}
.scroll{display:flex;flex-direction:column;gap:.5rem;padding:2px}
.eng{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.1rem;padding:.5rem .8rem;border-radius:12px;background:#0c0c0f;box-shadow:inset 3px 3px 8px #000,inset -2px -2px 5px #ffffff0a}
.eng h3{width:3.2rem;font:700 .78rem var(--sec);color:var(--ac)}
label{display:flex;align-items:center;gap:.45rem;font-size:.75rem;color:#a6a6a6}
label em{min-width:2.4rem;font-style:normal;color:var(--tx)}
input[type=range]{width:90px;accent-color:var(--ac)}
pre{flex:1;min-height:0;overflow:auto;padding:.9rem;border-radius:14px;background:#0c0c0f;box-shadow:inset 3px 3px 9px #000,inset -2px -2px 6px #ffffff0a;font:.82rem/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#cfcfd4}
pre i{font-style:normal;color:#6b6b73}

@media(max-width:900px){body{height:auto;overflow:auto}main{grid-template-columns:1fr}.pre{position:sticky;top:0;z-index:5;background:var(--bg)}.stage{height:44vh}.side{grid-template-rows:auto}}
@media(prefers-reduced-motion){*{transition-duration:.01s!important}}
</style>
</head>
<body>

<header>
  <div class="crumb">
    <a class="brand" href="index.html"><img src="logo.svg" alt="">KINEX<i>.js</i></a>
    <span>/</span><b id="name"></b>
  </div>
  <nav aria-label="Main">
    <a class="btn" href="index.html">Home</a>
    <button class="btn" onclick="history.back()">Back</button>
    <a class="btn" href="components.html">All components</a>
  </nav>
</header>

<main>
  <section class="pre">
    <div class="stage" id="stage">
      <div id="slot"></div>
      <label class="pill l">Preview background <input type="color" id="pbg" value="#0b0b0e"></label>
      <span class="pill r">Hover to zoom, click to flip</span>
    </div>
  </section>
  <section class="side">
    <div class="panel">
      <div class="ph"><h2>Customize</h2><button class="btn" id="reset">Reset</button></div>
      <form class="scroll" id="panel" onsubmit="return false"></form>
    </div>
    <div class="panel">
      <div class="ph"><h2>Code</h2><button class="btn" id="copy">Copy code</button></div>
      <pre id="code"></pre>
    </div>
  </section>
</main>

<script>
const CDN='https://cdn.jsdelivr.net/gh/KINEX-js/kinex.js-components@main/kinex.js';

/* ADD NEW COMPONENTS HERE. One entry each, no other change needed. The preview is self-contained (no kinex.js needed).
   inner = markup users fill in, css/html = what the preview shows (same as kinex.js builds), on = preview interaction,
   v = CSS variable, t = color | range, d = default, side = face shown while editing (0 front, 1 back) */
const COMPONENTS={
 'flip-card':{name:'Flip Card',
  inner:'<div data-front><!-- your front content --></div>\n  <div data-back><!-- your back content --></div>',
  css:`.kx-card{--kx-w:280px;--kx-radius:20px;--kx-front-bg:linear-gradient(160deg,#ff8a5b,#e83e8c);--kx-front-fg:#fff;--kx-back-bg:#fffaf5;--kx-back-fg:#1c1c24;display:inline-block;width:var(--kx-w);aspect-ratio:5/7;perspective:1200px;cursor:pointer;outline:none;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.kx-card:hover{transform:scale(1.06)}
.kx-card:focus-visible{outline:3px solid #fff8;outline-offset:6px;border-radius:var(--kx-radius)}
.kx-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.kx-flipped .kx-inner{transform:rotateY(180deg)}
.kx-face{position:absolute;inset:0;border-radius:var(--kx-radius);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 34px rgba(0,0,0,.18);transition:box-shadow .35s}
.kx-card:hover .kx-face{box-shadow:0 26px 54px rgba(0,0,0,.28)}
.kx-front{background:var(--kx-front-bg);color:var(--kx-front-fg)}
.kx-front::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,255,255,.28),transparent 45%)}
.kx-back{background:var(--kx-back-bg);color:var(--kx-back-fg);transform:rotateY(180deg)}`,
  html:'<div class="kx-card" tabindex="0"><div class="kx-inner"><div class="kx-face kx-front"></div><div class="kx-face kx-back"></div></div></div>',
  on:c=>{c.onclick=()=>c.classList.toggle('kx-flipped');c.onkeydown=e=>e.key==='Enter'&&c.click()},
  groups:[
   {g:'Front',side:0,f:[{l:'Background',v:'--kx-front-bg',t:'color',d:'#e83e8c'},{l:'Text',v:'--kx-front-fg',t:'color',d:'#ffffff'}]},
   {g:'Back',side:1,f:[{l:'Background',v:'--kx-back-bg',t:'color',d:'#fffaf5'},{l:'Text',v:'--kx-back-fg',t:'color',d:'#1c1c24'}]},
   {g:'Size',f:[{l:'Width',v:'--kx-w',t:'range',min:220,max:400,d:280,u:'px'},{l:'Corners',v:'--kx-radius',t:'range',min:0,max:40,d:20,u:'px'}]}]}
};

(() => {
  const $ = s => document.querySelector(s);
  const id = new URLSearchParams(location.search).get('c') || 'flip-card', C = COMPONENTS[id];
  if (!C) { $('main').innerHTML = '<p style="padding:3rem">Component not found. <a class="btn" href="components.html">All components</a></p>'; return; }

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const F = C.groups.flatMap(g => g.f.map(f => ({ ...f, side: g.side })));
  let S = {}, txt = '';
  document.title = `${C.name} | KINEX.js`;
  $('#name').textContent = C.name;

  // self-contained preview: the component's own markup + css, updated in place
  document.head.insertAdjacentHTML('beforeend', `<style>${C.css}</style>`);
  $('#slot').innerHTML = C.html;
  const card = $('#slot').firstElementChild;
  C.on?.(card);

  const build = () => $('#panel').innerHTML = C.groups.map(g => `<section class="eng"><h3>${g.g}</h3>${g.f.map(f =>
    `<label>${f.l}${f.t === 'range' ? `<input type="range" min="${f.min}" max="${f.max}" value="${f.d}" data-k="${f.v}"><em>${f.d}${f.u}</em>`
      : `<input type="color" value="${f.d}" data-k="${f.v}">`}</label>`).join('')}</section>`).join('');

  const code = () => {
    const st = F.filter(f => S[f.v]).map(f => `${f.v}:${S[f.v]}${f.u || ''}`);
    txt = `<!-- 1. Add once, just before </body> -->\n<script src="${CDN}"><\/script>\n\n<!-- 2. Place the component where you want it -->\n<div data-kinex="${id}"${st.length ? `\n     style="${st.join(';')}"` : ''}>\n  ${C.inner}\n</div>`;
    $('#code').innerHTML = esc(txt).replace(/(&lt;!--.*?--&gt;)/g, '<i>$1</i>');
  };
  const render = side => {
    F.forEach(f => card.style.setProperty(f.v, S[f.v] ? S[f.v] + (f.u || '') : ''));
    if (side != null) card.classList.toggle('kx-flipped', !!side); // show the face being edited
    code();
  };

  $('#panel').addEventListener('input', e => {
    const i = e.target, f = F.find(x => x.v === i.dataset.k), em = i.parentNode.querySelector('em');
    S[f.v] = i.value;
    if (em) em.textContent = i.value + f.u;
    render(f.side);
  });
  $('#reset').onclick = () => { S = {}; build(); render(0); };
  $('#pbg').oninput = e => $('#stage').style.setProperty('--pbg', e.target.value);
  $('#copy').onclick = async e => {
    await navigator.clipboard.writeText(txt);
    e.target.textContent = 'Copied';
    setTimeout(() => e.target.textContent = 'Copy code', 1500);
  };

  build(); render(0);
})();
</script>
</body>
</html>
